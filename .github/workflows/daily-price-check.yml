name: Daily price check

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the price check
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python check_prices.py

      - name: Save the updated history
        run: |
          git config user.name "price-tracker"
          git config user.email "price-tracker@users.noreply.github.com"
          git add price_history.csv
          git diff --cached --quiet || git commit -m "Add price check $(date -u +%F)"
          git push
